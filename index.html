<title>Nidhi & Shubh · 1 Year of Us</title><meta name="theme-color" content="#1b1131">
<meta property="og:title" content="Happy 1st Anniversary, Nidhi 💖"><meta property="og:description" content="A little world made just for you.">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Kaushan+Script&family=Caveat:wght@500&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Playfair+Display:ital,wght@1,600;1,700&family=EB+Garamond:ital,wght@1,500;1,600&family=Poppins:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1226;--bg2:#2a1f4a;--card:rgba(255,255,255,.07);--tx:#fdeee4;--mu:#b9b3d6;--pk:#f4a0b5;--gd:#ffb86b;--bd:rgba(244,160,181,.28);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root,:root[data-w="rain"]{--bg:#070a16;--bg2:#1b1131;--card:rgba(255,255,255,.065);--tx:#fdeee4;--mu:#b9b3d6;--pk:#f4a0b5;--gd:#ffb86b;--bd:rgba(255,184,107,.26);--b1:#e0718f;--b2:#7f68c8;--aura:radial-gradient(circle at 88% 64%,rgba(255,150,70,.30) 0 16px,transparent 60px),radial-gradient(circle at 78% 70%,rgba(255,120,60,.22) 0 10px,transparent 44px),radial-gradient(circle at 93% 74%,rgba(255,190,110,.28) 0 12px,transparent 50px),radial-gradient(circle at 50% 38%,rgba(255,184,107,.10),transparent 55%);--ns:0 0 8px rgba(244,160,181,.8),0 0 28px rgba(244,160,181,.55),0 0 56px rgba(255,184,107,.4)}
:root[data-w="sun"]{--bg:#fff0dd;--bg2:#ffc4b0;--card:rgba(255,255,255,.62);--tx:#4a2234;--mu:#8b5a62;--pk:#e8527f;--gd:#e07a06;--bd:rgba(232,82,127,.28);--b1:#ff7a59;--b2:#e8527f;--aura:radial-gradient(circle at 86% 7%,rgba(255,226,140,.95),rgba(255,176,100,.40) 20%,transparent 46%);--ns:0 2px 0 rgba(255,255,255,.7),0 0 24px rgba(255,150,100,.55)}
:root[data-w="snow"]{--bg:#e4eef9;--bg2:#b9cde8;--card:rgba(255,255,255,.66);--tx:#1f3350;--mu:#556f8f;--pk:#4f82d6;--gd:#7c6bd0;--bd:rgba(79,130,214,.32);--b1:#5b8bd6;--b2:#8d7cd6;--aura:radial-gradient(ellipse at 50% 108%,rgba(255,255,255,.95),transparent 55%),radial-gradient(circle at 15% 0%,rgba(255,255,255,.7),transparent 45%);--ns:0 2px 0 rgba(255,255,255,.9),0 0 26px rgba(120,160,230,.55)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{transition:background-color .6s;margin:0;font-family:Poppins,system-ui,sans-serif;color:var(--tx);background:var(--bg);background-image:linear-gradient(160deg,var(--bg),var(--bg2));background-attachment:fixed;min-height:100vh;overflow-x:hidden}
h1,h2,.script{font-family:'Kaushan Script','Great Vibes',cursive;font-weight:400}
h2{font-size:2.6rem;text-align:center;margin:0 0 18px;color:var(--pk)}
section{max-width:900px;margin:0 auto;padding:54px 18px}
.card{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--bd);border-radius:20px;padding:18px;box-shadow:0 8px 30px rgba(232,98,143,.12)}
button,input,textarea,select{font:inherit;color:inherit}
.btn{background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff;border:0;border-radius:30px;padding:11px 24px;cursor:pointer;transition:.25s;font-weight:600}
.btn:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 6px 20px rgba(232,98,143,.4)}
.btn.sm{padding:6px 14px;font-size:.8rem}.btn.gh{background:transparent;color:var(--pk);border:1px solid var(--pk)}
input,textarea,select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);margin:4px 0 10px}
.center{text-align:center}.mu{color:var(--mu)}
#hearts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#hearts i{position:absolute;bottom:-40px;font-style:normal;animation:fl linear infinite;opacity:.7}
@keyframes fl{to{transform:translateY(-115vh) rotate(40deg);opacity:0}}
main,#app{position:relative;z-index:1}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 16px}
.hero{position:relative;background:linear-gradient(180deg,transparent 35%,rgba(244,160,181,.14) 78%,rgba(255,184,107,.24))}.hero h1.serif{font-family:'Cormorant Garamond',serif;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(1.9rem,7vw,3.6rem);margin:0 0 6px;color:var(--tx);text-shadow:none}
.neon{font-family:'Kaushan Script',cursive;font-size:clamp(3rem,12vw,5.5rem);color:var(--nc,#f8b4c6);text-shadow:var(--ns);animation:gl 3s infinite alternate}@keyframes gl{to{text-shadow:0 0 4px rgba(244,160,181,.8),0 0 14px rgba(244,160,181,.5),0 0 30px rgba(255,184,107,.3)}}
.lights{position:absolute;top:0;left:0;right:0;height:44px;background:radial-gradient(circle,#ffd98a 0 3px,transparent 5px) 0 16px/30px 44px repeat-x;filter:drop-shadow(0 0 6px #ffd98a);animation:tw 2.4s infinite alternate}@keyframes tw{to{opacity:.4}}
.note{background:#fbf0e4;color:#4a2740;font-family:Caveat,cursive;font-size:1.5rem;padding:14px 20px;border-radius:6px;transform:rotate(3deg);box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:250px;margin-top:16px}
video{width:100%;border-radius:16px;background:#000;margin-top:8px}
#rain{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.7;background:repeating-linear-gradient(100deg,transparent 0 24px,rgba(170,190,255,.14) 24px 25px);background-size:120px 120px;animation:rn .45s linear infinite}@keyframes rn{to{background-position:-34px 120px}}.login h1{text-shadow:0 0 22px rgba(255,77,141,.8)}
.type{border-right:2px solid var(--pk);animation:bl .8s infinite;padding-right:4px}@keyframes bl{50%{border-color:transparent}}
.clock{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:26px 0}
.cu{min-width:74px;padding:14px 8px;border-radius:18px;background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(8px)}
.cu b{display:block;font-size:2rem;font-weight:600;color:var(--pk);font-variant-numeric:tabular-nums}.cu span{font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--mu)}
.big{font-size:clamp(3rem,14vw,6rem);color:var(--gd);font-weight:600;line-height:1}
.beat{display:inline-block;animation:bt 1.2s infinite}@keyframes bt{30%{transform:scale(1.3)}60%{transform:scale(1)}}
.tl{border-left:2px dashed var(--pk);margin-left:14px;padding-left:22px}
.tl .card{margin-bottom:18px;position:relative;opacity:0;transform:translateY(24px);transition:.7s}.tl .card.in{opacity:1;transform:none}
.tl .card:before{content:attr(data-e);position:absolute;left:-42px;top:12px;background:var(--bg);border-radius:50%;width:30px;height:30px;text-align:center;line-height:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.pol{background:#fff;color:#4a2740;padding:8px 8px 12px;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.18);transition:.3s;cursor:pointer;text-align:center;font-size:.8rem}
.pol:nth-child(odd){transform:rotate(-2deg)}.pol:nth-child(even){transform:rotate(2deg)}.pol:hover{transform:rotate(0) scale(1.06)}
.pol .ph{aspect-ratio:1;background:linear-gradient(135deg,#ffd6e5,#e6d3ff);display:flex;align-items:center;justify-content:center;font-size:3rem;overflow:hidden}.pol img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;padding:20px}#lb img{max-width:94%;max-height:75vh;border-radius:10px}
.quote{font-family:Caveat,cursive;font-size:2.1rem;min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;transition:opacity .5s}
.page{font-family:Caveat,cursive;font-size:1.55rem;line-height:1.7;background:linear-gradient(90deg,rgba(201,161,91,.15) 0 3px,transparent 3px);animation:fp .6s;transform-origin:left}@keyframes fp{from{transform:perspective(900px) rotateY(-60deg);opacity:0}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
#music{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:8px;align-items:center;padding:8px 14px}
.vin{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,var(--pk) 0 18%,#222 20%);border:2px solid var(--gd)}.vin.on{animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.theme{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:20}
#toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:var(--pk);color:#fff;padding:9px 20px;border-radius:20px;z-index:99;display:none}
.ring{position:relative;width:180px;height:180px;margin:0 auto}.ring svg{transform:rotate(-90deg)}.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.8rem;color:var(--mu)}
.login{max-width:360px;margin:12vh auto;padding:0 16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tabs .btn.on{outline:2px solid var(--gd)}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.pop{position:fixed;font-size:1.6rem;pointer-events:none;z-index:60;animation:pp 1.6s forwards}@keyframes pp{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root[data-w="sun"]{--nc:#e8527f}:root[data-w="snow"]{--nc:#4f82d6}
:root[data-w="sun"] .neon,:root[data-w="snow"] .neon{animation:none}
#fx,#aura,#rays,#fl{position:fixed;pointer-events:none}
#fx{inset:0;width:100%;height:100%;z-index:0}
#aura{inset:0;z-index:0;background:var(--aura);transition:opacity .8s}
#rays{top:-45vmax;right:-45vmax;width:90vmax;height:90vmax;z-index:0;opacity:0;transition:opacity .8s;background:repeating-conic-gradient(from 0deg,rgba(255,240,170,.34) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000,transparent 62%);mask:radial-gradient(circle,#000,transparent 62%);animation:rot 90s linear infinite}
:root[data-w="sun"] #rays{opacity:1}@keyframes rot{to{transform:rotate(360deg)}}
#fl{inset:0;z-index:2;background:#d5dcff;opacity:0;mix-blend-mode:screen}#fl.on{animation:lt .6s}
@keyframes lt{0%{opacity:0}8%{opacity:.5}18%{opacity:.05}30%{opacity:.38}100%{opacity:0}}
#wbar{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:30;display:flex;gap:4px;padding:4px;border-radius:30px;background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(12px)}
#wbar button{width:38px;height:38px;border-radius:50%;border:0;background:transparent;font-size:1.2rem;cursor:pointer;transition:.25s;filter:grayscale(.6);opacity:.75}
#wbar button:hover{transform:scale(1.12)}#wbar button.on{background:linear-gradient(135deg,var(--b1),var(--b2));filter:none;opacity:1;box-shadow:0 0 14px var(--pk)}
.scene{width:min(78vw,330px);margin:34px auto 6px;filter:drop-shadow(0 8px 24px rgba(0,0,0,.25));animation:fy 6s ease-in-out infinite alternate}@keyframes fy{to{transform:translateY(-6px)}}
.scene svg{width:100%;height:auto;display:block;border-radius:24px;overflow:hidden}
.pols{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:flex-start;margin-top:20px}
.qh{font-family:'Cormorant Garamond',serif;font-size:1.5rem;margin:8px 0 12px;font-weight:700}
.opt{display:block;width:100%;text-align:left;padding:12px 16px;margin:8px 0;border-radius:14px;border:1px solid var(--bd);background:var(--card);cursor:pointer;transition:.2s}
.opt:hover{transform:translateX(4px);border-color:var(--pk)}.opt.ok{background:rgba(63,191,133,.28);border-color:#3fbf85}.opt.bad{background:rgba(224,85,110,.24);border-color:#e0556e}
.bar{height:6px;border-radius:6px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--pk),var(--gd));transition:width .4s}
.qi{width:100%;max-height:260px;object-fit:cover;object-position:50% 30%;border-radius:14px;margin-top:10px}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:420px;margin:12px auto}
.mc{aspect-ratio:1;perspective:700px;cursor:pointer;-webkit-tap-highlight-color:transparent}.mc>div{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s}.mc.f>div{transform:rotateY(180deg)}
.mc span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:1.9rem}
.mc .fr{background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.2)}.mc .bk{background:var(--card);border:1px solid var(--bd);transform:rotateY(180deg)}.mc.m .bk{box-shadow:0 0 18px var(--pk);border-color:var(--pk)}
.sc{font-size:3.2rem;color:var(--gd);font-weight:600;line-height:1}
.wa{display:inline-block;text-decoration:none;background:#25D366!important;color:#fff!important;margin-top:10px}

.hero h1.serif{text-transform:none;font-style:italic;letter-spacing:.01em;line-height:1.1;font-size:clamp(2.3rem,9vw,4.2rem);margin:2px 0 8px;font-weight:700}
:root[data-w="rain"] .hero h1.serif{font-family:'Cormorant Garamond',serif;color:#fdeee4;text-shadow:0 0 18px rgba(255,184,107,.45)}
:root[data-w="sun"] .hero h1.serif{font-family:'Playfair Display',serif;color:#7a1f45;text-shadow:0 2px 0 rgba(255,255,255,.75),0 0 22px rgba(255,170,100,.5)}
:root[data-w="snow"] .hero h1.serif{font-family:'EB Garamond',serif;font-weight:600;color:#1f3350;text-shadow:0 2px 0 #fff,0 0 22px rgba(120,160,230,.55)}
.av{position:relative;width:260px;height:250px;margin:4px auto 0}
.av svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;border-radius:0}
.av .u{z-index:0}.av .o{z-index:2}
.av img{position:absolute;z-index:1;left:55px;top:73px;width:150px;height:150px;border-radius:50%;object-fit:cover;object-position:50% 22%;border:4px solid var(--gd);box-shadow:0 10px 30px rgba(0,0,0,.35),0 0 26px var(--pk);background:var(--card)}
.av .spin{transform-origin:50% 59.2%;animation:rot 40s linear infinite}
.av-snow img{border-color:#fff;box-shadow:0 10px 30px rgba(79,130,214,.35),0 0 0 6px rgba(255,255,255,.55)}
.av .ig,.av .ib{top:84px;width:128px;height:128px;object-position:50% 50%}.av .ig{left:10px}.av .ib{left:122px}.av .is{display:none}.av.one .ig,.av.one .ib{display:none}.av.one .is{display:block}
</style></head><body>

rain:{tag:'Rainy nights, one umbrella, and you ☂️',toast:'Rainy mood on ☔',h:['💖','💧','✨','💕','☔','🌹'],b:'💧☔💙✨'},

const fx=$('#fx'),cx=fx.getContext('2d'),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;let FW=0,FH=0,PT=[],raf=0,lt=0;
function fxSeed(){const m=FW<640?.55:1,R=Math.random;PT=[];
if(wmode==='rain')for(let i=0;i<260*m;i++)PT.push({x:R()*FW,y:R()*FH,l:10+R()*16,v:15+R()*12,a:.12+R()*.3});
else if(wmode==='snow')for(let i=0;i<150*m;i++)PT.push({x:R()*FW,y:R()*FH,r:1+R()*3.2,v:.5+R()*1.3,s:R()*6.3,w:.3+R()});

function fxSize(){const r=Math.min(devicePixelRatio||1,2);FW=innerWidth;FH=innerHeight;fx.width=FW*r;fx.height=FH*r;cx.setTransform(r,0,0,r,0,0);fxSeed();if(RM)fxDraw()}
function fxDraw(){cx.clearRect(0,0,FW,FH);
if(wmode==='rain'){cx.lineWidth=1.1;for(const p of PT){cx.strokeStyle='rgba(185,205,255,'+p.a+')';cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x-p.l*.22,p.y+p.l);cx.stroke();if(!RM){p.y+=p.v;p.x-=p.v*.22;if(p.y>FH){p.y=-20;p.x=Math.random()*FW+40}}}}
else if(wmode==='snow'){cx.fillStyle='rgba(255,255,255,.95)';cx.shadowColor='rgba(70,110,170,.55)';cx.shadowBlur=4;for(const p of PT){if(!RM){p.s+=.012;p.x+=Math.sin(p.s)*p.w;p.y+=p.v;if(p.y>FH+5){p.y=-5;p.x=Math.random()*FW}}cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill()}cx.shadowBlur=0}
else{for(const p of PT){if(!RM){p.s+=.02;p.y-=p.v;p.x+=Math.sin(p.s)*.4;if(p.y<-5){p.y=FH+5;p.x=Math.random()*FW}}cx.fillStyle='rgba(255,190,80,'+(.25+.4*Math.pow(Math.sin(p.s*2),2))+')';cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill()}}}
function fxLoop(){if(!document.hidden)fxDraw();raf=requestAnimationFrame(fxLoop)}
function storm(){clearTimeout(lt);if(wmode!=='rain'||RM)return;lt=setTimeout(()=>{const f=$('#fl');f.classList.remove('on');void f.offsetWidth;f.classList.add('on');storm()},7000+Math.random()*9000)}
function setW(w,ev){wmode=w;document.documentElement.dataset.w=w;try{localStorage.setItem('nw',w)}catch(e){}
document.querySelectorAll('#wbar button').forEach(b=>b.classList.toggle('on',b.dataset.w===w));
const m=document.querySelector('meta[name=theme-color]');if(m)m.content={rain:'#1b1131',sun:'#ffc4b0',snow:'#b9cde8'}[w];
fxSeed();if(RM)fxDraw();storm();const s=$('#scene');if(s)s.innerHTML=avScene(w);const t=$('#tag');if(t)t.textContent=WT[w].tag;hearts();
if(ev){toast(WT[w].toast);const r=ev.currentTarget.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,WT[w].b)}}
document.querySelectorAll('#wbar button').forEach(b=>b.onclick=e=>setW(b.dataset.w,e));
addEventListener('resize',fxSize);fxSize();setW(wmode);if(!RM)fxLoop();

/* ===== games: quiz, memory lane, match hearts ===== */
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function prep(x){let o;if(x.dyn==='days'){const n=Math.max(0,dayN('2025-11-02'));o=[...new Set([n,n+7,Math.max(0,n-12),n+31])].map((v,i)=>({t:String(v),ok:i===0}))}
else{const ok=(parseInt(x.ans,10)||1)-1;o=['a','b','c','d'].map((k,i)=>({t:x[k],ok:i===ok})).filter(z=>z.t)}
return{q:x.q,img:x.img,o:shuf(o)}}
const GOOD=['Perfect, Bubu! 💖','You know us so well 😍','Correct! A kiss is owed 😘','That’s my girl! 🌹'],BAD=['Oops! Think again, jaanu 🙈','Not quite… but I still love you 💞','Cutie, that was a sneaky one 😜'];
function runQuiz(el,items,label){const L=items.map(prep);let i=0,sc=0,lock=false;
const step=()=>{if(i>=L.length)return done();const x=L[i];lock=false;
el.innerHTML=`<div class="bar"><i style="width:${i/L.length*100}%"></i></div><p class="mu" style="font-size:.8rem;margin:8px 0 0">Question ${i+1} of ${L.length}</p>${x.img?`<img class="qi" src="${x.img}" alt="">`:''}<h3 class="qh">${esc(x.q)}</h3>${x.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o.t)}</button>`).join('')}<p id="fb" class="script center" style="font-size:1.6rem;min-height:2.2em;margin:8px 0 0;color:var(--pk)"></p>`;
el.querySelectorAll('.opt').forEach(b=>b.onclick=e=>{if(lock)return;lock=true;const o=x.o[b.dataset.k];
el.querySelectorAll('.opt').forEach((z,k)=>{if(x.o[k].ok)z.classList.add('ok')});
if(o.ok){sc++;b.classList.add('ok');$('#fb').textContent=GOOD[Math.floor(Math.random()*GOOD.length)];burst(e.clientX,e.clientY,'💖✨')}else{b.classList.add('bad');$('#fb').textContent=BAD[Math.floor(Math.random()*BAD.length)]}
setTimeout(()=>{i++;step()},1500)})};
const done=()=>{const n=L.length,p=sc/n;SCR[label]=sc+'/'+n;
const msg=p===1?'Soulmate level 💍 You remember everything!':p>=.7?'Amazing! Almost perfect 💕':p>=.4?'Not bad… we need more cuddle revision 😘':'Hmm… time for a date night to refresh your memory 😂💗';
el.innerHTML=`<div class="center"><div class="bar"><i style="width:100%"></i></div><p class="mu">${esc(label)} complete</p><div class="sc">${sc}<span style="font-size:1.4rem"> / ${n}</span></div><p class="script" style="font-size:2rem;color:var(--pk);margin:10px 0">${msg}</p>${p===1?'<div class="note" style="margin:10px auto;transform:rotate(-2deg)">🎁 Secret unlocked: one surprise date night, redeemable any time. Screenshot this and show Shubh! 💌</div>':''}<button class="btn" id="ra">Play again 🔁</button> <a class="btn wa" target="_blank" rel="noopener" href="${waLink('💘 Hi Shubh, Nidhi here! I just scored '+sc+'/'+n+' on our '+label+' 🥰 '+(p===1?'Perfect score — you owe me that surprise date night! 😎💍':'Want to see if you can beat me? 😜'))}">💬 Tell Shubh my score</a></div>`;
$('#ra').onclick=()=>runQuiz(el,items,label);if(p>=.7)for(let k=0;k<4;k++)setTimeout(()=>burst(innerWidth*Math.random(),innerHeight*.5*Math.random()+80),k*300)};
step()}
function runMatch(el){const em=['💖','☂️','❄️','☀️','🌹','🎶'];let deck=shuf([...em,...em]),open=[],lock=false,mv=0,ok=0,t0=0,best=0;try{best=+localStorage.getItem('nbest')||0}catch(e){}
el.innerHTML=`<p class="center mu" style="margin:0">Find all 6 pairs · Moves: <b id="mv">0</b>${best?' · Best: '+best:''}</p><div class="mg">${deck.map((e,i)=>`<div class="mc" data-i="${i}"><div><span class="fr">💗</span><span class="bk">${e}</span></div></div>`).join('')}</div>`;
el.querySelectorAll('.mc').forEach(c=>c.onclick=ev=>{const i=+c.dataset.i;if(lock||c.classList.contains('f'))return;if(!t0)t0=Date.now();c.classList.add('f');open.push(i);
if(open.length===2){mv++;$('#mv').textContent=mv;const[a,b]=open,ca=el.querySelector(`[data-i="${a}"]`),cb=el.querySelector(`[data-i="${b}"]`);
if(deck[a]===deck[b]){ca.classList.add('m');cb.classList.add('m');open=[];ok++;burst(ev.clientX,ev.clientY,'💖✨');if(ok===6)win()}
else{lock=true;setTimeout(()=>{ca.classList.remove('f');cb.classList.remove('f');open=[];lock=false},800)}}});
const win=()=>{const s=Math.round((Date.now()-t0)/1000);let nb=!best||mv<best;try{if(nb)localStorage.setItem('nbest',mv)}catch(e){}SCR['Match Hearts']=mv+' moves in '+s+'s';
el.insertAdjacentHTML('beforeend',`<div class="center"><p class="script" style="font-size:2rem;color:var(--pk);margin:6px 0">All hearts matched! 💞</p><p class="mu">${mv} moves · ${s} seconds${nb?' · new best!':''}</p><button class="btn" id="pa">Play again 🔁</button> <a class="btn wa" target="_blank" rel="noopener" href="${waLink('🃏 Hi Shubh, Nidhi here! I matched all the hearts in '+mv+' moves ('+s+' seconds) 🥰 Beat that if you can! 😜')}">💬 Tell Shubh</a></div>`);
$('#pa').onclick=()=>runMatch(el);for(let k=0;k<5;k++)setTimeout(()=>burst(innerWidth*Math.random(),innerHeight*.5*Math.random()+80),k*300)}}
function gameInit(){const g=$('#gm');if(!g)return;
const T=[['quiz','💘 Love Quiz'],['mem','🧠 Memory Lane'],['match','🃏 Match Hearts']];
g.innerHTML=`<div class="tabs" style="justify-content:center">${T.map(t=>`<button class="btn sm gh" data-gt="${t[0]}">${t[1]}</button>`).join('')}</div><div id="gb"></div>`;
const show=k=>{g.querySelectorAll('[data-gt]').forEach(b=>b.classList.toggle('gh',b.dataset.gt!==k));const b=$('#gb');
if(k==='quiz')D.quiz.length?runQuiz(b,D.quiz,'Love Quiz'):b.innerHTML='<p class="mu center">Add quiz questions from the admin panel 💌</p>';
else if(k==='mem')D.memory.length?runQuiz(b,D.memory,'Memory Lane'):b.innerHTML='<p class="mu center">Add memory questions from the admin panel 💌</p>';
else runMatch(b)};
g.querySelectorAll('[data-gt]').forEach(b=>b.onclick=()=>show(b.dataset.gt));show('quiz')}

hearts();prepSong();loginView();
</script></body></html>
